<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>
<style>
  body {
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(to bottom, #ffcce0, #ffe6f0);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Arial', sans-serif;
  }

  /* Bunga jatuh */
  .flower {
    position: absolute;
    top: -50px;
    color: pink;
    font-size: 24px;
    animation: fall linear infinite;
  }
  @keyframes fall {
    to {
      transform: translateY(110vh) rotate(360deg);
      opacity: 0;
    }
  }

  .box {
    text-align: center;
    background: rgba(255,255,255,0.8);
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 0 30px rgba(255,105,180,0.5);
    z-index: 10;
  }

  .heart {
    font-size: 60px;
    color: red;
    animation: beat 1s infinite;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }

  button {
    background: #ff69b4;
    color: white;
    border: none;
    padding: 15px 30px;
    font-size: 18px;
    border-radius: 50px;
    cursor: pointer;
    margin-top: 20px;
    transition: 0.3s;
  }
  button:hover {
    background: #ff1493;
    transform: scale(1.1);
  }

  #loveText {
    font-size: 40px;
    color: #d40055;
    font-weight: bold;
    margin-top: 20px;
    display: none;
    animation: muncul 1s ease;
  }
  @keyframes muncul {
    from { opacity: 0; transform: scale(0.5); }
    to { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

<!-- Bunga jatuh -->
<script>
  function createFlower() {
    const flower = document.createElement('div');
    flower.classList.add('flower');
    flower.innerHTML = '🌸';
    flower.style.left = Math.random() * 100 + 'vw';
    flower.style.animationDuration = Math.random() * 3 + 2 + 's';
    document.body.appendChild(flower);
    setTimeout(() => flower.remove(), 5000);
  }
  setInterval(createFlower, 200);
</script>

<div class="box">
  <div class="heart">❤️</div>
  <h2>Coba Pencet</h2>
  <button onclick="showLove()">Coba Pencet</button>
  <div id="loveText">I LOVE YOU ❤️</div>
</div>

<script>
  function showLove() {
    document.getElementById('loveText').style.display = 'block';
  }
</script>

</body>
  </html>
